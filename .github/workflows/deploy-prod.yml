name: Deploy Flutter Web (produção)

on:
  push:
    branches:
      - main
    # Só o que entra no build ou nos índices do Firestore justifica publicar.
    # O deploy manual (workflow_dispatch) ignora esse filtro.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'bin/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Antes do site, porque o código depende das regras e dos índices. As regras do repositório
    # substituem as do projeto; os índices só são criados e atualizados (sem --force).
    - name: Publicar regras e índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15 deploy --only firestore \
          --project expogeo-fad33 --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=prod

    # Uma página HTML por rota e o sitemap.xml, para o Google. Lê o Firestore de produção pela
    # API pública, sem credencial. Se a leitura falhar, o deploy para aqui e nada é enviado.
    - name: Gerar páginas para o Google
      run: |
        flutter test tool/seo/gerar_seo.dart --dart-define=APP_ENV=prod
        test -s build/web/sitemap.xml
        test -s build/web/sobre.html

    - name: Sync build/web to HostGator (produção)
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/
