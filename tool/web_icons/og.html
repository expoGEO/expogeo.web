<!doctype html>
<!--
  Imagem de compartilhamento (Open Graph), 1200 × 630. Usada por generate.sh.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 800;
        src: url("../../assets/fonts/BricolageGrotesque-ExtraBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Figtree";
        font-weight: 500;
        src: url("../../assets/fonts/Figtree-Medium.ttf") format("truetype");
      }
      /* Cores do AppColors (lib/core/theme/app_colors/app_colors.dart). */
      :root {
        --surface: #f7f5f2;
        --ink: #1f1b18;
        --ink-secondary: #5e5852;
        --accent: #c94400;
      }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface); }
      main {
        box-sizing: border-box;
        height: 606px;
        padding: 0 96px;
        display: flex;
        align-items: center;
        gap: 72px;
      }
      .simbolo { flex: none; width: 280px; height: 280px; }
      /* O símbolo ocupa só 60% do logo_simple.png; a escala tira a margem transparente. */
      .simbolo img { display: block; width: 100%; height: 100%; object-fit: contain; transform: scale(1.6); }
      h1 {
        margin: 0;
        font: 800 112px/1 "Bricolage Grotesque", sans-serif;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      h1 span { color: var(--accent); }
      p {
        margin: 28px 0 0;
        font: 500 34px/1.3 "Figtree", sans-serif;
        color: var(--ink-secondary);
      }
      .faixa { height: 24px; background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="simbolo"><img src="../../assets/images/logo_simple.png" alt="" /></div>
      <div>
        <h1>expo<span>GEO</span></h1>
        <p>Curadoria digital do saber geográfico</p>
      </div>
    </main>
    <div class="faixa"></div>
  </body>
</html>
