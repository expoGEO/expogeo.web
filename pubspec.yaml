name: expogeo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

scripts:
  get: fvm flutter pub get

  clean:
    $script: fvm flutter clean
    $after: fvm flutter pub get

  builder:
    $script: fvm dart run build_runner watch --delete-conflicting-outputs

  build:
    $script: fvm flutter build web --release

  run:
    $script: fvm flutter run -d chrome --web-renderer html

  test:
    $before: dart pub global run full_coverage
    $script: fvm flutter test --coverage

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  go_router: ^14.6.2
  flutter_svg: ^2.2.2
  url_launcher: ^6.3.1

  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

  mobx: ^2.4.0
  flutter_mobx: ^2.1.0

  get_it: ^7.6.0

  dartz: ^0.10.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.12
  mobx_codegen: ^2.5.0
  freezed: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
