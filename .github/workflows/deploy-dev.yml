name: Deploy Flutter Web (dev)

on:
  push:
    branches:
      - develop
    # Só o que entra no build ou nos índices do Firestore justifica publicar.
    # O deploy manual (workflow_dispatch) ignora esse filtro.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.vscode/**'
      - 'bin/**'
      - '.github/workflows/ci.yml'
      - 'analysis_options.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Antes do site, porque o código depende das regras e dos índices. As regras do repositório
    # substituem as do projeto; os índices só são criados e atualizados (sem --force).
    - name: Publicar regras e índices do Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
          npx --yes firebase-tools@15 deploy --only firestore \
          --project expogeo-dev --non-interactive

    - name: Ler versão do Flutter do .fvmrc
      id: fvm
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release --dart-define=APP_ENV=dev

    # Acessos do dev não podem entrar nas estatísticas de produção.
    - name: Remover o Google Analytics
      run: |
        sed -i '/<!-- analytics:inicio -->/,/<!-- analytics:fim -->/d' build/web/index.html
        ! grep -q googletagmanager build/web/index.html

    - name: Bloquear indexação do ambiente de dev
      run: |
        printf 'User-agent: *\nDisallow: /\n' > build/web/robots.txt

    # O web/.htaccess (reescrita de rotas, compressão e cache) vai junto com o build. Aqui ele
    # ganha a senha do dev. O arquivo de senhas (.htpasswd) fica fora da pasta pública e é
    # criado uma vez no cPanel (Privacidade de Diretório); só o caminho dele vem da variável
    # HTPASSWD_PATH do ambiente DEV. Sem ela o deploy falha, em vez de publicar o dev aberto.
    - name: Proteger o dev com senha
      env:
        HTPASSWD_PATH: ${{ vars.HTPASSWD_PATH }}
      run: |
        test -n "$HTPASSWD_PATH" || { echo '::error::Defina a variável HTPASSWD_PATH no ambiente DEV'; exit 1; }
        # O "Require all granted" do arquivo comum liberaria JS, imagens e fontes sem senha.
        sed -i '/^<FilesMatch /,/^<\/FilesMatch>/d' build/web/.htaccess
        ! grep -q 'Require all granted' build/web/.htaccess
        printf '\nAuthType Basic\nAuthName "ExpoGeo | Ambiente de Testes"\nAuthUserFile "%s"\nRequire valid-user\n' "$HTPASSWD_PATH" >> build/web/.htaccess
        grep -q '^Require valid-user' build/web/.htaccess

    - name: Sync build/web to HostGator (dev)
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        security: loose
        server-dir: ./
        local-dir: build/web/
