name: expogeo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

scripts:
  get: fvm flutter pub get

  clean:
    $script: fvm flutter clean
    $after: fvm flutter pub get

  builder:
    $script: fvm dart run build_runner watch --delete-conflicting-outputs

  build:
    $script: fvm flutter build web --release

  run:
    $script: fvm flutter run -d chrome --web-renderer html

  test:
    $before: dart pub global run full_coverage
    $script: fvm flutter test --coverage

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.2
  syncfusion_flutter_pdfviewer: ^31.1.19

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

  # State Management
  mobx: ^2.4.0
  flutter_mobx: ^2.1.0

  # Dependency Injection
  get_it: ^7.6.0

  # Utilities
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.12
  mobx_codegen: ^2.5.0
  freezed: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Aleo
      fonts:
        - asset: assets/fonts/Aleo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Aleo-Light.ttf
          weight: 300
        - asset: assets/fonts/Aleo-Medium.ttf
          weight: 400
        - asset: assets/fonts/Aleo-Regular.ttf
          weight: 500
        - asset: assets/fonts/Aleo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Aleo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Aleo-ExtraBold.ttf
          weight: 800
