name: Deploy Flutter Web to HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'

    - name: Clean Flutter cache
      run: flutter clean

    - name: Install dependencies
      run: flutter pub get

    - name: Build Flutter Web app
      run: flutter build web --release

    - name: Deploy Flutter Web to HostGator
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      env:
        # Força uso de IPv4 apenas (HostGator não suporta IPv6)
        NODE_OPTIONS: '--dns-result-order=ipv4first'
      with:
        # IMPORTANTE: Use o IP IPv4 do servidor no secret FTP_HOST
        # Encontre o IP em: cPanel > Server Information > Shared IP Address
        # Exemplo: 192.168.1.1 (ao invés de ftp.seudominio.com.br)
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: build/web/
        server-dir: /public_html/
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
